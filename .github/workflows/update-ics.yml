name: Update filtered ICS

on:
  schedule:
    # Every 6 hours. Adjust as needed (cron is in UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Filter the schedule
        run: node scripts/filter-ics.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/filtered.ics
          git diff --staged --quiet || git commit -m "Update filtered ICS"
          git push
